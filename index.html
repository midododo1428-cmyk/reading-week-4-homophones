<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Year 3 Homophones Challenge</title>
<style>
:root{--purple:#5d0e92;--purple2:#8b1dd1;--pink:#f02c9a;--gold:#ffbf00;--ink:#27163f}
*{box-sizing:border-box} html,body{margin:0;max-width:100%;overflow-x:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(135deg,#fffdf8,#fdf6ff 60%,#fffbe8);color:var(--ink)}
.screen{display:none;min-height:100vh;flex-direction:column}.screen.active{display:flex}.topline{height:12px;background:linear-gradient(90deg,var(--purple),var(--pink),var(--gold),var(--purple))}
.hero{max-width:1100px;width:94%;margin:auto;display:grid;grid-template-columns:minmax(250px,340px) minmax(320px,540px);gap:26px;align-items:center;padding:26px 0;flex:1}
.logoBig{width:min(315px,76vw);display:block;margin:auto}.panel{background:#fff;border:3px solid #efc65f;border-radius:30px;padding:30px;box-shadow:0 18px 45px rgba(77,11,101,.12)}
.kicker{font-size:16px;font-weight:1000;color:var(--pink);text-transform:uppercase}.panel h1{font-size:clamp(36px,5vw,56px);line-height:1;color:var(--purple);margin:8px 0}.sub{font-size:19px;font-weight:800;color:#7a4b88;margin-bottom:20px}
label{display:block;font-size:18px;font-weight:1000;color:var(--purple);margin-bottom:8px}input{width:100%;height:56px;border:2px solid #cbb5dc;border-radius:17px;padding:0 15px;font-size:19px}
button{cursor:pointer}.btn{border:0;border-radius:18px;min-height:54px;padding:12px 20px;font-size:19px;font-weight:1000}.primary{width:100%;margin-top:16px;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple2),var(--pink))}
.footer{padding:9px 12px 14px;text-align:center;border-top:2px solid #f0d377;background:linear-gradient(#fff,#fff6d9)}.footer img{display:block;margin:auto;width:min(420px,90vw)}
.quizWrap{width:min(1080px,95vw);margin:auto;padding:14px 0;flex:1}.headBar{display:flex;align-items:center;gap:14px}.logoSmall{width:110px;max-width:22vw}.progressArea{flex:1;min-width:0}.topMeta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.topPill{background:#fff;border:3px solid #efc35e;border-radius:22px;padding:10px 18px;font-size:clamp(18px,2.5vw,28px);font-weight:1000;color:var(--purple)}
.tools{display:flex;gap:10px;align-items:center}.scoreBox{background:#fff;border:3px solid #efc35e;border-radius:20px;padding:8px 14px;font-weight:1000;color:var(--purple);font-size:22px}.iconBtn{width:54px;height:54px;border-radius:50%;border:3px solid #efc35e;background:#fff;font-size:25px}
.track{height:18px;background:#f0e0f2;border-radius:99px;overflow:hidden;border:3px solid #efc35e;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--purple2));width:0;transition:.25s}
.card{position:relative;background:#fff;border:4px solid var(--purple2);border-radius:28px;padding:16px 18px 18px;margin-top:12px;box-shadow:0 18px 36px rgba(67,12,93,.12)}
.setBadge{display:inline-block;background:#efe4fb;color:var(--purple);font-weight:1000;padding:7px 14px;border-radius:99px;margin-bottom:10px}
.vocabGrid{display:grid;grid-template-columns:minmax(260px,390px) minmax(0,1fr);gap:20px;align-items:center;background:linear-gradient(135deg,#fffaf0,#fcf0ff);border:3px solid #efc85f;border-radius:24px;padding:14px}
.imgBox{overflow:hidden;border-radius:20px;background:#fff;border:3px solid #efc35e}.imgBox img{display:block;width:100%;height:260px;object-fit:cover}
.wordTitle{font-size:clamp(34px,5vw,62px);font-weight:1000;line-height:1;color:var(--purple);margin-bottom:10px;text-transform:capitalize}.defTag{display:inline-block;background:var(--pink);color:white;border-radius:999px;padding:5px 14px;font-size:15px;font-weight:1000;margin-bottom:9px}.definition{background:#fff9ea;border:3px solid #efc860;border-radius:22px;padding:15px 17px;font-size:clamp(19px,2.2vw,27px);font-weight:900;line-height:1.3;overflow-wrap:anywhere}
.sentenceCard{margin-top:14px;background:#fffdf6;border:3px solid #e6b0f0;border-radius:25px;padding:17px 20px;text-align:center;overflow:hidden}.sentence{font-size:clamp(28px,3.5vw,46px);line-height:1.18;font-weight:1000;margin:0 auto;max-width:100%;overflow-wrap:break-word;word-break:normal}.sentence strong{color:var(--pink);text-decoration:underline;text-underline-offset:5px}
.choiceRow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.correctBtn{background:linear-gradient(#2dea68,#14b642);color:#fff;border:3px solid #0da03a;font-size:clamp(22px,2.8vw,34px)}.wrongBtn{background:linear-gradient(#ff4c92,#eb166b);color:#fff;border:3px solid #d21a5e;font-size:clamp(22px,2.8vw,34px)}
.feedback{min-height:32px;text-align:center;margin-top:12px;font-size:18px;font-weight:1000}
.reward{display:none;position:absolute;inset:0;border-radius:24px;background:rgba(255,255,255,.97);align-items:center;justify-content:center;z-index:9}.reward.show{display:flex}.reward img{width:min(390px,80vw);max-height:340px;object-fit:contain}
.finalBox{width:min(850px,94vw);margin:auto;background:#fff;border:4px solid #efc35c;border-radius:30px;padding:28px;text-align:center}.bigScore{font-size:clamp(50px,8vw,80px);font-weight:1000;color:var(--pink)}.report{text-align:left;max-height:320px;overflow:auto;border:2px solid #ead8a3;background:#fffdf7;padding:15px;border-radius:18px;margin:16px 0}.item{padding:9px 0;border-bottom:1px solid #eee}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.secondary{background:#fff;border:2px solid #c8aedf;color:var(--purple)}
@media(max-width:760px){.hero{grid-template-columns:1fr}.headBar{flex-direction:column;align-items:stretch}.logoSmall{align-self:center;width:150px}.vocabGrid{grid-template-columns:1fr}.imgBox img{height:auto;max-height:340px}.choiceRow{grid-template-columns:1fr}.sentence{font-size:clamp(26px,7vw,38px)}}
</style></head><body>
<section id="start" class="screen active"><div class="topline"></div><div class="hero"><img class="logoBig" src="assets/year3-logo.png" alt="Year 3 logo"><div class="panel"><div class="kicker">Year 3 • Homophones Challenge</div><h1>Spot the Mistakes!</h1><div class="sub">Look at the picture, read the definition, then decide if the bold word is correct.</div><form id="startForm"><label for="student">Student's name</label><input id="student" maxlength="40" required><button class="btn primary" type="submit">START QUIZ ⭐</button></form></div></div><div class="footer"><img src="assets/md-banner.png" alt="Designed by M.D."></div></section>
<section id="quiz" class="screen"><div class="topline"></div><div class="quizWrap"><div class="headBar"><img class="logoSmall" src="assets/year3-logo.png" alt="Year 3 logo"><div class="progressArea"><div class="topMeta"><div id="questionPill" class="topPill"></div><div class="tools"><div class="scoreBox">⭐ Score: <span id="scoreSmall">0</span></div><button id="soundBtn" class="iconBtn" type="button">🔊</button><button id="homeBtn" class="iconBtn" type="button">🏠</button></div></div><div class="track"><div id="fill" class="fill"></div></div></div></div>
<div class="card"><div id="setBadge" class="setBadge"></div><div class="vocabGrid"><div class="imgBox"><img id="wordImg" alt=""></div><div><div id="wordTitle" class="wordTitle"></div><div class="defTag">DEFINITION</div><div id="definition" class="definition"></div></div></div><div class="sentenceCard"><p id="sentence" class="sentence"></p></div><div class="choiceRow"><button id="yesBtn" class="btn correctBtn" type="button">✓ Correct</button><button id="noBtn" class="btn wrongBtn" type="button">✗ Wrong</button></div><div id="feedback" class="feedback"></div><div id="reward" class="reward"><img src="assets/correct-star.png" alt="Correct Great Answer"></div></div></div><div class="footer"><img src="assets/md-banner.png" alt="Designed by M.D."></div></section>
<section id="final" class="screen"><div class="topline"></div><div class="finalBox"><img class="logoSmall" src="assets/year3-logo.png"><h1>Quiz Complete! ⭐</h1><div id="finalName" class="sub"></div><div id="bigScore" class="bigScore"></div><div id="finalMessage" class="sub"></div><div id="report" class="report"></div><div class="actions"><button id="retryBtn" class="btn primary" style="width:auto;margin:0">Retry Mistakes</button><button id="restartBtn" class="btn secondary">Restart</button></div></div><div class="footer"><img src="assets/md-banner.png"></div></section>
<audio id="applause" preload="auto" src="assets/applause.mp3"></audio>
<script>
const Q=[{"s": "We drove off in the car for our summer <strong>brake</strong>.", "ok": false, "fix": "brake → break", "set": 1, "word": "brake", "definition": "a part of a vehicle or bicycle used to slow down or stop", "img": "assets/brake.jpg"}, {"s": "When I dropped the egg, I was amazed it didn’t <strong>break</strong>.", "ok": true, "fix": "break is correct", "set": 1, "word": "break", "definition": "to damage or separate something into pieces", "img": "assets/break.jpg"}, {"s": "Speeding downhill on my bike, I had to pull on the <strong>brake</strong>.", "ok": true, "fix": "brake is correct", "set": 1, "word": "brake", "definition": "a part of a vehicle or bicycle used to slow down or stop", "img": "assets/brake.jpg"}, {"s": "King Arthur called for his bravest <strong>knight</strong>.", "ok": true, "fix": "knight is correct", "set": 2, "word": "knight", "definition": "a brave soldier from long ago who served a king or queen", "img": "assets/knight.jpg"}, {"s": "The dragon attacked the castle in the middle of the <strong>knight</strong>.", "ok": false, "fix": "knight → night", "set": 2, "word": "knight", "definition": "a brave soldier from long ago who served a king or queen", "img": "assets/knight.jpg"}, {"s": "The cat woke me up miaowing in the <strong>night</strong>.", "ok": true, "fix": "night is correct", "set": 2, "word": "night", "definition": "the dark time between evening and morning", "img": "assets/night.jpg"}, {"s": "Every time I see Gran, she tells me how much I’ve <strong>groan</strong>.", "ok": false, "fix": "groan → grown", "set": 3, "word": "groan", "definition": "a low sound someone makes when they are unhappy, tired, or in pain", "img": "assets/groan.jpg"}, {"s": "I was surprised how tall the sunflower had <strong>grown</strong>.", "ok": true, "fix": "grown is correct", "set": 3, "word": "grown", "definition": "became bigger or taller", "img": "assets/grown.jpg"}, {"s": "When Mum told me to tidy my room, I let out a <strong>groan</strong>.", "ok": true, "fix": "groan is correct", "set": 3, "word": "groan", "definition": "a low sound someone makes when they are unhappy, tired, or in pain", "img": "assets/groan.jpg"}, {"s": "The cook brought out a cake and asked if we’d like a <strong>piece</strong>.", "ok": true, "fix": "piece is correct", "set": 4, "word": "piece", "definition": "one part of something larger", "img": "assets/piece.jpg"}, {"s": "Grandad went into the garden for some <strong>peace</strong> and quiet.", "ok": true, "fix": "peace is correct", "set": 4, "word": "peace", "definition": "a calm state with no fighting or trouble", "img": "assets/peace.jpg"}, {"s": "I’m annoyed that the last <strong>peace</strong> of the jigsaw is missing.", "ok": false, "fix": "peace → piece", "set": 4, "word": "peace", "definition": "a calm state with no fighting or trouble", "img": "assets/peace.jpg"}, {"s": "The circus strongman picked up the heavy <strong>wait</strong>.", "ok": false, "fix": "wait → weight", "set": 5, "word": "wait", "definition": "to stay until something happens or someone arrives", "img": "assets/wait.jpg"}, {"s": "We had a very long <strong>weight</strong> at the airport.", "ok": false, "fix": "weight → wait", "set": 5, "word": "weight", "definition": "how heavy a person or thing is", "img": "assets/weight.jpg"}, {"s": "The athlete stepped on the scales to check her <strong>weight</strong>.", "ok": true, "fix": "weight is correct", "set": 5, "word": "weight", "definition": "how heavy a person or thing is", "img": "assets/weight.jpg"}, {"s": "The squirrel searched for somewhere to <strong>bury</strong> its nuts.", "ok": true, "fix": "bury is correct", "set": 6, "word": "bury", "definition": "to put something into the ground and cover it", "img": "assets/bury.jpg"}, {"s": "The birds have eaten every single <strong>bury</strong> on the tree.", "ok": false, "fix": "bury → berry", "set": 6, "word": "bury", "definition": "to put something into the ground and cover it", "img": "assets/bury.jpg"}, {"s": "The <strong>berry</strong> I picked stained my fingers red.", "ok": true, "fix": "berry is correct", "set": 6, "word": "berry", "definition": "a small, soft, juicy fruit", "img": "assets/berry.jpg"}, {"s": "There was such a noise when a <strong>plain</strong> flew overhead.", "ok": false, "fix": "plain → plane", "set": 7, "word": "plain", "definition": "simple, with no special decoration", "img": "assets/plain.jpg"}, {"s": "I thought my birthday dress looked very <strong>plain</strong>.", "ok": true, "fix": "plain is correct", "set": 7, "word": "plain", "definition": "simple, with no special decoration", "img": "assets/plain.jpg"}, {"s": "The captain of the <strong>plane</strong> invited me into the cockpit.", "ok": true, "fix": "plane is correct", "set": 7, "word": "plane", "definition": "an aircraft that flies in the sky", "img": "assets/plane.jpg"}, {"s": "The gorilla escaped and was never <strong>seen</strong> again.", "ok": true, "fix": "seen is correct", "set": 8, "word": "seen", "definition": "noticed or looked at with your eyes; past participle of see", "img": "assets/seen.jpg"}, {"s": "The bonfire and the fireworks created a wonderful <strong>seen</strong>.", "ok": false, "fix": "seen → scene", "set": 8, "word": "seen", "definition": "noticed or looked at with your eyes; past participle of see", "img": "assets/seen.jpg"}, {"s": "I’m in the <strong>scene</strong> with the shepherds at Christmas.", "ok": true, "fix": "scene is correct", "set": 8, "word": "scene", "definition": "a place or part of a story, film, or play where something happens", "img": "assets/scene.jpg"}, {"s": "After falling in the mud, I had to change my <strong>close</strong>.", "ok": false, "fix": "close → clothes", "set": 9, "word": "close", "definition": "to shut something, or to stop a shop from being open", "img": "assets/close.jpg"}, {"s": "I think our corner shop starts to <strong>close</strong> around 5pm.", "ok": true, "fix": "close is correct", "set": 9, "word": "close", "definition": "to shut something, or to stop a shop from being open", "img": "assets/close.jpg"}, {"s": "If you take up sport, you need the right <strong>clothes</strong>.", "ok": true, "fix": "clothes is correct", "set": 9, "word": "clothes", "definition": "things people wear, such as shirts, trousers, and dresses", "img": "assets/clothes.jpg"}, {"s": "Mum bought some <strong>meat</strong> at the butcher’s shop.", "ok": true, "fix": "meat is correct", "set": 10, "word": "meat", "definition": "food that comes from animals", "img": "assets/meat.jpg"}, {"s": "I agreed to <strong>meat</strong> my friends in town.", "ok": false, "fix": "meat → meet", "set": 10, "word": "meat", "definition": "food that comes from animals", "img": "assets/meat.jpg"}, {"s": "Every week, we all <strong>meet</strong> at the sports club.", "ok": true, "fix": "meet is correct", "set": 10, "word": "meet", "definition": "to come together with another person or group", "img": "assets/meet.jpg"}]; const $=id=>document.getElementById(id); const screens=[$("start"),$("quiz"),$("final")];
let order=Q.map((_,i)=>i),idx=0,score=0,name="",soundOn=true,locked=false,mistakes=new Set();
function show(s){screens.forEach(x=>x.classList.remove("active"));s.classList.add("active");window.scrollTo(0,0)}
function render(){locked=false;$("reward").classList.remove("show");$("feedback").textContent="";$("yesBtn").disabled=false;$("noBtn").disabled=false;const q=Q[order[idx]];$("questionPill").textContent=`Question ${idx+1} of ${order.length}`;$("scoreSmall").textContent=score;$("fill").style.width=`${(idx/order.length)*100}%`;$("setBadge").textContent=`Set ${q.set}`;$("wordImg").src=q.img;$("wordImg").alt=`Illustration of ${q.word}`;$("wordTitle").textContent=q.word;$("definition").textContent=q.definition;$("sentence").innerHTML=q.s}
function play(){if(!soundOn)return;const a=$("applause");try{a.currentTime=0;a.play().catch(()=>{})}catch(e){}}
function answer(v){if(locked)return;const qi=order[idx],q=Q[qi];if(v===q.ok){locked=true;score++;$("scoreSmall").textContent=score;$("yesBtn").disabled=true;$("noBtn").disabled=true;$("feedback").style.color="#5d0e92";$("feedback").textContent=q.ok?"Excellent! The bold word is correct.":"Excellent! "+q.fix;$("reward").classList.add("show");play();setTimeout(()=>{$("reward").classList.remove("show");idx++;idx>=order.length?finish():render()},950)}else{mistakes.add(qi);$("feedback").style.color="#d61f6a";$("feedback").textContent="Try again — check the picture and definition."}}
function finish(){show($("final"));$("finalName").textContent=`Well done, ${name}!`;$("bigScore").textContent=`${score} / ${order.length}`;const p=Math.round(score/order.length*100);$("finalMessage").textContent=p===100?"Outstanding — perfect score!":p>=80?"Excellent work!":p>=60?"Good work — review below.":"Keep practising — you can do it!";if(!mistakes.size){$("report").innerHTML="<h3>Final Report</h3><p>⭐ No mistakes recorded.</p>";$("retryBtn").style.display="none"}else{$("retryBtn").style.display="inline-block";$("report").innerHTML="<h3>Review</h3>"+[...mistakes].map(i=>`<div class="item"><b>${Q[i].word}</b><br>${Q[i].s}<br><span style="color:#5d0e92;font-weight:1000">${Q[i].fix}</span></div>`).join("")}}
$("startForm").addEventListener("submit",e=>{e.preventDefault();name=$("student").value.trim();if(!name)return;order=Q.map((_,i)=>i);idx=0;score=0;mistakes.clear();show($("quiz"));render()});
$("yesBtn").addEventListener("click",()=>answer(true));$("noBtn").addEventListener("click",()=>answer(false));$("soundBtn").addEventListener("click",()=>{soundOn=!soundOn;$("soundBtn").textContent=soundOn?"🔊":"🔇"});$("homeBtn").addEventListener("click",()=>show($("start")));$("retryBtn").addEventListener("click",()=>{order=[...mistakes];mistakes.clear();idx=0;score=0;show($("quiz"));render()});$("restartBtn").addEventListener("click",()=>show($("start")));
</script></body></html>
